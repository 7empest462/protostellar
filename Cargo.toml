[package]
name = "protostellar"
version = "0.1.0"
edition = "2021"
authors = ["Tempest"]
description = "Scientifically accurate solar system formation simulator in Rust"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug-assertions = false
debug = false
overflow-checks = true
rpath = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3


[package.metadata.cargo-machete]
ignored = ["glam"]

[lints.clippy]
# Keep the important groups
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "warn", priority = -1 }
perf        = { level = "warn", priority = -1 }
style       = { level = "warn", priority = -1 }
complexity  = { level = "warn", priority = -1 }

# Pedantic – enable but silence the noisiest ones
pedantic = { level = "warn", priority = -2 }

# Common pedantic lints that generate huge noise in scientific / simulation code
module_name_repetitions = "allow"
similar_names           = "allow"
too_many_lines          = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
wildcard_imports        = "allow"          # if you use them intentionally
struct_excessive_bools  = "allow"
cast_possible_truncation = "allow"
cast_precision_loss     = "allow"
cast_sign_loss          = "allow"
doc_markdown            = "allow"
many_single_char_names  = "allow"
needless_pass_by_value = "allow"
return_self_not_must_use = "allow"
# …add more allows as you triage

# Nursery – keep off or very selective until the codebase is cleaner
nursery = { level = "allow", priority = -1 }

[dependencies]
# Bevy 0.19.1 Engine
bevy = { version = "0.19.1", default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_scene",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_picking",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_state",
    "bevy_window",
    "bevy_log",
    "bevy_winit",
    "bevy_gltf",
    "bevy_mesh",
    "tonemapping_luts",
    "default_font",
    "zstd_rust",
    "x11",
    "wayland",
] }

# Direct WGPU & Math Pipelines
wgpu = "29.0"
glam = { version = "0.29", features = ["fast-math"] }
encase = "0.12"
bytemuck = { version = "1.21", features = ["derive"] }

# High-Performance Specialized Data Structures & Concurrency Crates
hashbrown = "0.15"
parking_lot = "0.12"
dashmap = "6.1"
crossbeam = "0.8"
crossbeam-channel = "0.5"
flume = "0.11"
slab = "0.4"
once_cell = "1.21"
smallvec = "1.16"
crossterm = "0.28"
tokio = { version = "1.44", features = ["rt", "sync"] }

# Parallelism & Random Utilities
rayon = "1.10"
rand = "0.9"
rand_distr = "0.5"
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"
bevy_shader = "0.19.1"


